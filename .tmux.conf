# prefix change
unbind C-b
set -g prefix M-b
bind M-a send-prefix

# copy/paste vi mode
setw -g mode-keys vi

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h set-option status off
bind -n M-j set-option status on

# reload config file:
bind r source-file ~/.tmux.conf

# esc delay
set -sg escape-time 0

set -g default-terminal tmux-256color
set -g bell-action any
set -g status on
set -g status-position top
set-option -g allow-rename off
set -g status-left ''
set -g status-right ''
set -g status-justify centre # center align window list

# mouse support
set -g mouse on
#set-option -s set-clipboard off

# statusbar 
set-window-option -g status-left " #S"

set -g display-time 2000

# default statusbar colors
set -g status-fg '#f7f7f7'
set -g status-bg "#323232"
set -g status-right "%a, %d.%m  %H:%M "

# panes
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#005577'

# active window title colors
set -g window-status-current-style 'bg=#303030,fg=#ffffff'
set -g window-status-style 'bg=#303030,fg=#b5b5b5'
